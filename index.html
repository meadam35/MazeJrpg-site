</head>

<body>

    <div id="app">
        <div id="loading" style="display: table-cell; margin: auto; width:100vw; height:100vh; vertical-align: middle; background: #ffcc10;">
            <div style="display: block; margin: auto; width: 9em; color: white;font-family: 'Segoe UI', sans-serif;">
                <div style="text-align: center; font-size: 0.85em;">Made with<br/><a href="https://github.com/kniEngine/kni"><img src="kni.png" border="0" alt="Kni"></a></div>
                <div style="text-align: center; font-size: 1.8em;">loading&nbsp;<marquee style="width:0.9em; vertical-align: bottom;">.&nbsp;.&nbsp;.&nbsp;&nbsp;&nbsp;</marquee></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
    </div>

    <!-- Hidden text field for typing names on a phone. Focusing it opens the on-screen keyboard (see mazeTextBoxOpen). -->
    <input id="mazeTextBox" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           style="position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px;" />
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module">
        import { BrotliDecode } from './js/decode.min.js';
        window.BrotliDecode = BrotliDecode;
        // Set this to enable Brotli (.br) decompression on static webServers
        // that don't support content compression and http://.
        var enableBrotliDecompression = false;
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity)
            {
                if (enableBrotliDecompression === true && type !== 'dotnetjs' && location.hostname !== 'localhost')
                {
                    return (async function()
                    {
                        const response = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                        if (!response.ok)
                            throw new Error(response.statusText);
                        const originalResponseBuffer = await response.arrayBuffer();
                        const originalResponseArray = new Int8Array(originalResponseBuffer);
                        const contentType = (type === 'dotnetwasm')
                                          ? 'application/wasm'
                                          : 'application/octet-stream';
                        const decompressedResponseArray = BrotliDecode(originalResponseArray);
                        return new Response(decompressedResponseArray,
                                            { headers: { 'content-type': contentType }
                                   });
                    })();
                }
            }
        });
    </script>

    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>

    <script>
        // Opens the browser's file picker for one text file and resolves with its text, or null if none was chosen.
        // Used by the developer's save replacement.
        window.mazePickTextFile = function ()
        {
            return new Promise(function (resolve)
            {
                var input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json,application/json';
                input.onchange = function ()
                {
                    var file = input.files && input.files[0];
                    if (!file) { resolve(null); return; }
                    var reader = new FileReader();
                    reader.onload = function () { resolve(String(reader.result)); };
                    reader.onerror = function () { resolve(null); };
                    reader.readAsText(file);
                };
                input.click();
            });
        };

        // On-screen touch buttons. Each button is held while at least one finger is on it, so two fingers can hold two buttons.
        // Bits: 1 up, 2 down, 4 left, 8 right (the D-pad), 16 A, 32 B, 64 Menu (the same values as Input's Touch bits in C#).
        var touchHeld = {};
        var touchBits = { up: 1, down: 2, left: 4, right: 8, a: 16, b: 32, menu: 64 };

        function touchMaskNow()
        {
            var mask = 0;
            for (var name in touchBits)
            {
                if (touchHeld[name] && touchHeld[name].size > 0) mask |= touchBits[name];
            }
            return mask;
        }

        // The D-pad as a bitmask: the gamepad's D-pad (standard mapping) and the on-screen arrows, combined.
        window.mazeReadDPad = function ()
        {
            var mask = touchMaskNow() & 15;
            var pads = navigator.getGamepads ? navigator.getGamepads() : [];
            for (var i = 0; i < pads.length; i++)
            {
                var g = pads[i];
                if (!g || !g.connected || g.mapping !== 'standard') continue;
                var b = g.buttons;
                if (b[12] && b[12].pressed) mask |= 1;
                if (b[13] && b[13].pressed) mask |= 2;
                if (b[14] && b[14].pressed) mask |= 4;
                if (b[15] && b[15].pressed) mask |= 8;
                break;
            }
            return mask;
        };

        // The on-screen A, B and Menu buttons as bits 16, 32 and 64.
        window.mazeReadTouchButtons = function ()
        {
            return touchMaskNow() & 112;
        };

        // Connects the on-screen pad's buttons. The pad is hidden unless the screen is touch-only (CSS in css/app.css).
        function wireTouchPad()
        {
            var pad = document.getElementById('touchPad');
            if (!pad) return;
            var buttons = pad.querySelectorAll('[data-touch]');
            for (var i = 0; i < buttons.length; i++)
            {
                (function (btn)
                {
                    var name = btn.getAttribute('data-touch');
                    var down = function (e)
                    {
                        e.preventDefault();
                        if (!touchHeld[name]) touchHeld[name] = new Set();
                        touchHeld[name].add(e.pointerId);
                        btn.classList.add('tp-on');
                        if (btn.setPointerCapture) btn.setPointerCapture(e.pointerId);
                    };
                    var up = function (e)
                    {
                        e.preventDefault();
                        if (touchHeld[name]) touchHeld[name].delete(e.pointerId);
                        if (!touchHeld[name] || touchHeld[name].size === 0) btn.classList.remove('tp-on');
                    };
                    btn.addEventListener('pointerdown', down);
                    btn.addEventListener('pointerup', up);
                    btn.addEventListener('pointercancel', up);
                    btn.addEventListener('lostpointercapture', up);
                    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
                })(buttons[i]);
            }
        }

        function tickJS()
        {
            window.theInstance.invokeMethod('TickDotNet');
            window.requestAnimationFrame(tickJS);
        }

        // The name entry's text field. A phone keyboard only opens for a text field focused by a tap, so while a name is
        // being typed a tap on the game focuses this hidden field (see initRenderJS).
        var textBox = document.getElementById('mazeTextBox');
        var textBoxWanted = false;
        var textBoxSubmitted = false;
        textBox.addEventListener('keydown', function (e)
        {
            if (e.key === 'Enter') { e.preventDefault(); textBoxSubmitted = true; }
        });
        window.mazeTextBoxOpen = function (maxLength)
        {
            textBoxWanted = true;
            textBoxSubmitted = false;
            textBox.maxLength = maxLength;
            textBox.value = '';
        };
        window.mazeTextBoxClose = function ()
        {
            textBoxWanted = false;
            textBox.value = '';
            textBox.blur();
        };
        // The text typed into the field while it has focus, or null when it doesn't (the game then reads the keys itself).
        window.mazeTextBoxRead = function ()
        {
            return document.activeElement === textBox ? textBox.value : null;
        };
        // True once after Enter is pressed in the field.
        window.mazeTextBoxSubmitted = function ()
        {
            var s = textBoxSubmitted;
            textBoxSubmitted = false;
            return s;
        };

        window.initRenderJS = (instance) =>
        {
            window.theInstance = instance;

            // set initial canvas size
            var canvas = document.getElementById('theCanvas');
            var holder = document.getElementById('canvasHolder');
            canvas.width = holder.clientWidth;
            canvas.height = holder.clientHeight;
            // disable context menu on right click
            canvas.addEventListener("contextmenu", e => e.preventDefault());
            // a tap on the game opens the keyboard when a name is being typed
            canvas.addEventListener("click", function () { if (textBoxWanted) textBox.focus(); });
            // on-screen buttons for touch screens
            wireTouchPad();

            // begin game loop
            window.requestAnimationFrame(tickJS);
        };

        window.addEventListener("keydown", function(event)
        {
            // Keys typed into the name field are the field's own (Space included).
            if (event.target === textBox) return;
            // Prevent Arrows Keys and Spacebar scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1)
                event.preventDefault();
        });
        window.addEventListener("wheel", function(event)
        {
            // Prevent Mousewheel scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            event.preventDefault();
        }, { passive: false });
    </script>
</body>

</html>
